{% extends "base.html" %}

{% block content %}
<h2>Add Movement</h2>

<p>
    <strong>{{ item.product.name }}</strong> — {{ item.location.code }}
</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-success">Save</button>
    <a href="{% url 'inventory:inventory_detail' item.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
