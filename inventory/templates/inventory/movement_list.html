{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Stock Movements</h2>

    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Product</th>
                <th>Location</th>
                <th>Quantity</th>
                <th>Note</th>
            </tr>
        </thead>
        <tbody>
            {% for m in movements %}
            <tr>
                <td>{{ m.date }}</td>
                <td>{{ m.get_movement_type_display }}</td>
                <td>{{ m.item.product.name }}</td>
                <td>{{ m.item.location.name }}</td>
                <td>{{ m.quantity }}</td>
                <td>{{ m.note }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
