<h2>Inventory Dashboard</h2>

<div class="row">
    <div class="col-md-3">
        <div class="kpi-card">
            <h4>Total Stock</h4>
            <p>{{ total_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="kpi-card">
            <h4>Low Stock</h4>
            <p>{{ low_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="kpi-card">
            <h4>Critical Items</h4>
            <p>{{ critical_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="kpi-card">
            <h4>Movements This Month</h4>
            <p>{{ movements_month }}</p>
        </div>
    </div>
</div>

<hr>

<h3>Stock by Product</h3>
<canvas id="stockChart"></canvas>

<h3>Movements This Month</h3>
<canvas id="movementChart"></canvas>

<h3>Top 5 Most Moved Items (OUT)</h3>
<canvas id="topOutChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
new Chart(document.getElementById('stockChart'), {
    type: 'bar',
    data: {
        labels: {{ stock_labels|safe }},
        datasets: [{
            label: 'Stock',
            data: {{ stock_values|safe }},
            backgroundColor: 'rgba(54, 162, 235, 0.6)'
        }]
    }
});

new Chart(document.getElementById('movementChart'), {
    type: 'line',
    data: {
        labels: {{ movement_labels|safe }},
        datasets: [{
            label: 'Movements',
            data: {{ movement_values|safe }},
            borderColor: 'rgba(255, 99, 132, 1)',
            fill: false
        }]
    }
});

new Chart(document.getElementById('topOutChart'), {
    type: 'bar',
    data: {
        labels: {{ top_out_labels|safe }},
        datasets: [{
            label: 'Quantity OUT',
            data: {{ top_out_values|safe }},
            backgroundColor: 'rgba(255, 159, 64, 0.6)'
        }]
    }
});
</script>
