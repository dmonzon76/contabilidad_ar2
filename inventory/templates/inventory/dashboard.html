{% extends "base.html" %}

{% block content %}
<h2>Inventory Dashboard</h2>

<div class="row mb-4">
    <div class="col-md-3">
        <div class="card p-3">
            <h4>Total Stock</h4>
            <p>{{ total_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h4>Low Stock</h4>
            <p>{{ low_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h4>Critical Stock</h4>
            <p>{{ critical_stock }}</p>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h4>Movements This Month</h4>
            <p>{{ movements_month }}</p>
        </div>
    </div>
</div>

<h3>Stock by Product & Location</h3>
<canvas id="stockChart"></canvas>

<h3 class="mt-5">Daily Movements</h3>
<canvas id="movementChart"></canvas>

<h3 class="mt-5">Top OUT Products</h3>
<canvas id="topOutChart"></canvas>

<script>
    const stockCtx = document.getElementById('stockChart');
    new Chart(stockCtx, {
        type: 'bar',
        data: {
            labels: {{ stock_labels|safe }},
            datasets: [{
                label: 'Stock',
                data: {{ stock_values|safe }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)'
            }]
        }
    });

    const movementCtx = document.getElementById('movementChart');
    new Chart(movementCtx, {
        type: 'line',
        data: {
            labels: {{ movement_labels|safe }},
            datasets: [{
                label: 'Movements',
                data: {{ movement_values|safe }},
                borderColor: 'rgba(255, 99, 132, 0.8)'
            }]
        }
    });

    const topOutCtx = document.getElementById('topOutChart');
    new Chart(topOutCtx, {
        type: 'bar',
        data: {
            labels: {{ top_out_labels|safe }},
            datasets: [{
                label: 'OUT Quantity',
                data: {{ top_out_values|safe }},
                backgroundColor: 'rgba(255, 159, 64, 0.6)'
            }]
        }
    });
</script>

{% endblock %}
