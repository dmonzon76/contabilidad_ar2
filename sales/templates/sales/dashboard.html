{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Sales</h2>
    <p class="text-muted">Invoices & Customers</p>

    <div class="row">

        <!-- Nueva Factura -->
        <div class="col-md-4 mb-3">
            <a href="/sales/invoices/create/" class="btn btn-primary w-100 py-3">
                <i class="bi bi-receipt"></i> New Invoice
            </a>
        </div>

        <!-- Clientes -->
        <div class="col-md-4 mb-3">
            <a href="/sales/customers/" class="btn btn-secondary w-100 py-3">
                <i class="bi bi-people"></i> Customers
            </a>
        </div>

        <!-- Historial de Facturas -->
        <div class="col-md-4 mb-3">
            <a href="/sales/invoices/" class="btn btn-info w-100 py-3">
                <i class="bi bi-journal-text"></i> Invoice History
            </a>
        </div>

    </div>

</div>
{% endblock %}
