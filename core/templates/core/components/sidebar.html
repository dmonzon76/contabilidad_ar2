{% load core_modules %}

<aside class="erp-sidebar bg-light border-end">

    <div class="p-3">
        <h5 class="text-muted">Modules</h5>
    </div>

    <ul class="nav flex-column">

        <!-- Dashboard -->
        <li class="nav-item">
            <a class="nav-link" href="{% url 'core:dashboard' %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>

        {% get_modules as MODULES %}

        {% for m in MODULES %}
            {% if not m.requires_company or request.session.active_company_id %}

                <!-- Section Title -->
                <li class="nav-item mt-3 px-3 text-muted small">
                    {{ m.name }}
                </li>

                <!-- Module Link -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="{% if m.requires_company %}
                                {% url m.url request.session.active_company_id %}
                             {% else %}
                                {% url m.url %}
                             {% endif %}">
                        <i class="{{ m.icon }}"></i> {{ m.name }}
                    </a>
                </li>

            {% endif %}
        {% endfor %}

        <!-- System Section -->
        <li class="nav-item mt-3 px-3 text-muted small">
            System
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{% url 'company:company_select' %}">
                <i class="bi bi-arrow-left-right"></i> Change Company
            </a>
        </li>

    </ul>

</aside>
