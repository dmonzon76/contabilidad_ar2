{% extends "base.html" %}

{% block content %}
<h2 class="erp-title-page">Supplier</h2>

<div class="erp-card p-3">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary">Save</button>
        <a href="{% url 'purchases:supplier_list' %}" class="btn btn-secondary">Cancel</a>
        {% if supplier and supplier.id %}
        <a href="{% url 'purchases:supplier_tax_edit' supplier.id %}" class="btn btn-outline-primary">Edit Fiscal Profile</a>
        {% endif %}
    </form>
</div>
{% endblock %}
