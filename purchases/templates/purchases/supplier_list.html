{% extends "base.html" %}

{% block content %}
<h2 class="erp-title-page">Suppliers</h2>

<div class="erp-card p-3">
    <a href="{% url 'purchases:supplier_create' %}" class="btn btn-primary mb-3">New Supplier</a>
    <a href="{% url 'purchases:purchase_list' %}" class="btn btn-secondary mb-3">Back to purchases</a>

    <table class="table table-sm">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for s in suppliers %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.phone }}</td>
                <td>
                    <a href="{% url 'purchases:supplier_edit' s.id %}">Edit</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No suppliers yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
