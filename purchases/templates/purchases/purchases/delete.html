{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Delete Purchase</h2>
    <p>Are you sure you want to delete purchase #{{ object.invoice_number }}?</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'purchases:purchase_detail' object.id %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
{% endblock %}
