{% extends "base.html" %}

{% block content %}
<div class="container py-4">
<h2>{{ customer.name }}</h2>

<p><strong>Email:</strong> {{ customer.email }}</p>
<p><strong>Phone:</strong> {{ customer.phone }}</p>
<p><strong>Address:</strong> {{ customer.address }}</p>
<p><strong>CUIT:</strong> {{ customer.tax_id }}</p>

<a href="{% url 'customers:customer_edit' customer.pk %}" class="btn btn-primary">Edit</a>
<a href="{% url 'customers:customer_list' %}" class="btn btn-secondary">Back</a>
<a href="{% url 'customers:customer_delete' customer.pk %}" class="btn btn-outline-danger">Delete</a>
</div>
{% endblock %}
