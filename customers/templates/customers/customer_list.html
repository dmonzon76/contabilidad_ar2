{% extends "base.html" %}

{% block content %}
<div class="container py-4">
<h2>Customers</h2>

<a href="{% url 'customers:customer_add' %}" class="btn btn-primary mb-3">Add Customer</a>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td><a href="{% url 'customers:customer_detail' c.pk %}">{{ c.name }}</a></td>
            <td>{{ c.email }}</td>
            <td>{{ c.phone }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
