{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-3">

    <div
        class="
            d-flex
            justify-content-between
            align-items-center
            mb-3
        "
    >


        <h2 class="mb-0">

            {% if form.instance.pk %}
                Edit Employee
            {% else %}
                New Employee
            {% endif %}

        </h2>

        <a
            href="{% url 'payroll:employee_list' %}"
            class="btn btn-secondary"
        >
            Back
        </a>

    </div>

    <div class="card">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    {% for field in form %}

                    <div class="col-md-6 mb-3">

                        <label
                            class="form-label"
                        >
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}

                        <div
                            class="text-danger small"
                        >
                            {{ field.errors }}
                        </div>

                        {% endif %}

                    </div>

                    {% endfor %}

                </div>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Save
                    </button>

                    <a
                        href="{% url 'payroll:employee_list' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
