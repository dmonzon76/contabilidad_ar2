{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Confirm Fiscal Invoice</h2>

    <p class="text-muted">
        Sale {{ sale.number }} — {{ sale.customer.name }} — Total: {{ sale.total_amount }}
    </p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-warning">Generate Fiscal Invoice</button>
    </form>
</div>
{% endblock %}
