{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">
        New Tax Rule
    </h2>

    <div class="card p-4">

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for err in field.errors %}
                        <div class="text-danger">
                            {{ err }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Rule
            </button>

            <a
                href="{% url 'fiscal:thirdparty_tax_edit' profile.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
