{% extends "base.html" %}

{% block content %}
<div class="container py-4">

    <h2 class="mb-4">Suppliers</h2>

    <a href="{% url 'suppliers:supplier_add' %}" class="btn btn-primary mb-3">Add Supplier</a>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Name</th>
                <th>CUIT</th>
                <th>Email</th>
                <th>Phone</th>
                <th>IVA</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in suppliers %}
            <tr>
                <td>
                    <a href="{% url 'suppliers:supplier_detail' s.pk %}">
                        {{ s.name }}
                    </a>
                </td>
                <td>{{ s.tax_id }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.phone }}</td>
                <td>{{ s.get_iva_condition_display }}</td>
                <td><a href="{% url 'suppliers:supplier_edit' s.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
