{% extends "base.html" %}
{% block title %}Fiscal Years{% endblock %}

{% block content %}
<h1 class="mb-4">Fiscal Years</h1>
<a href="{% url 'accounting:fiscal_year_create' %}" class="btn btn-primary mb-3">
    Create Fiscal Year
</a>

<table class="table table-sm table-hover">
    <thead class="table-light">
        <tr>
            <th>Year</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th style="width: 180px;">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for fy in fiscal_years %}
        <tr>
            <td>{{ fy.year }}</td>
            <td>{{ fy.start_date }}</td>
            <td>{{ fy.end_date }}</td>
            <td>{{ fy.status }}</td>
            <td>
                <a href="{% url 'accounting:fiscal_year_open' fy.pk %}" class="btn btn-success btn-sm">
                    Open
                </a>
                <a href="{% url 'accounting:fiscal_year_close' fy.pk %}" class="btn btn-danger btn-sm">
                    Close
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
